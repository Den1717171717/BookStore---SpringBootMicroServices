spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres

  flyway:
    baseline-on-migrate: true

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "*"

  info:
    git:
      mode: full